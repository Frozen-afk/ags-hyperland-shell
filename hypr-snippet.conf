# ===========================================================
# Hyprland config snippet — AGS v2 / Astal shell integration
# Append/merge into ~/.config/hypr/hyprland.conf
# ===========================================================

# --- Startup -------------------------------------------------
exec-once = ags run ~/.config/ags/app.ts
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = gromit-mpx --hidden
# swww-daemon is required before WallpaperPicker can call `swww img`
exec-once = swww-daemon
# supergfxctl / power-profiles-daemon usually run as systemd services;
# only exec these if not already socket/service activated:
# exec-once = supergfxd
# exec-once = power-profiles-daemon

# --- Layer rules ----------------------------------------------
# Blur + ignore zero-size layers so popovers/menus don't flash
# an opaque box before their content is measured.
layerrule = blur, bar-0
layerrule = blur, bar-1
layerrule = blur, launcher
layerrule = blur, clipboard
layerrule = blur, power-menu
layerrule = blur, screenshot-menu
layerrule = blur, notification-popups
layerrule = blur, vitals
layerrule = blur, dock
layerrule = blur, osd
layerrule = blur, quicksettings
layerrule = blur, wallpaperpicker

layerrule = ignorezero, bar-0
layerrule = ignorezero, bar-1
layerrule = ignorezero, launcher
layerrule = ignorezero, clipboard
layerrule = ignorezero, power-menu
layerrule = ignorezero, screenshot-menu
layerrule = ignorezero, notification-popups
layerrule = ignorezero, vitals
layerrule = ignorezero, dock
layerrule = ignorezero, osd
layerrule = ignorezero, quicksettings
layerrule = ignorezero, wallpaperpicker

layerrule = ignorealpha 0.1, bar-0
layerrule = ignorealpha 0.1, bar-1
layerrule = ignorealpha 0.2, osd

# Animate popups sliding/fading in
layerrule = animation slide, launcher
layerrule = animation slide, clipboard
layerrule = animation slide, notification-popups
layerrule = animation slide right, quicksettings
layerrule = animation popin 85%, wallpaperpicker
layerrule = animation fade, osd

# --- Keybinds ---------------------------------------------------
# NOTE: app.ts's requestHandler parses "ags request <cmd> <arg>" by
# splitting on a space — use a space before the window name, not a colon.
$mainMod = SUPER

bind = $mainMod, SPACE, exec, ags request "toggle-window launcher"
bind = $mainMod, V, exec, ags request "toggle-window clipboard"
bind = $mainMod, ESCAPE, exec, ags request "toggle-window power-menu"
bind = $mainMod SHIFT, S, exec, ags request "toggle-window screenshot-menu"
bind = $mainMod, N, exec, ags request "toggle-window quicksettings"
bind = $mainMod, W, exec, ags request "toggle-window wallpaperpicker"
bind = $mainMod, D, exec, ags request draw-toggle
bind = , Print, exec, grim ~/Pictures/Screenshots/$(date +%s).png

# Hardware audio keys — handled by WirePlumber via wpctl. The OSD widget
# listens to AstalWp volume/mute signals directly, so it pops automatically;
# no `ags request` call is needed here.
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Hardware brightness keys — handled by brightnessctl. lib/brightness.ts
# watches /sys/class/backlight/*/brightness, so the OSD pops automatically
# even though AGS didn't drive the change itself.
bindle = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindle = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# --- Window rules -------------------------------------------------
# Keep the shell's own popups floating, centered, and unaffected
# by normal tiling/animation rules.
windowrulev2 = float, class:^(ags)$
windowrulev2 = noanim, class:^(ags)$, title:^(bar-.*)$
windowrulev2 = pin, class:^(ags)$, title:^(dock)$
