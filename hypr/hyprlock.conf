# ===========================================================
# hyprlock — lock screen for the Astral shell
# Deploy as ~/.config/hypr/hyprlock.conf (install.sh does it).
# Wallpaper line: point it at your wallpaper or keep the dynamic
# exec that asks swww for the current one.
# ===========================================================

background {
    monitor =
    path = screenshot

    blur_passes = 3
    blur_size = 10
    noise = 0.02
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.2
}

# Current clock — big and glassy
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    font_size = 120
    font_family = Adwaita Sans
    color = rgba(c0caf5e6)
    shadow_passes = 2
    shadow_size = 6

    position = 0, 160
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %d %B %Y')"
    font_size = 22
    font_family = Adwaita Sans
    color = rgba(c0caf59e)

    position = 0, 40
    halign = center
    valign = center
}

# Input field
input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(c0caf51a)
    inner_color = rgba(16161e88)
    font_color = rgba(c0caf5e6)
    fade_on_empty = true
    placeholder_text = <i>Password…</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    rounding = 14
    check_color = rgba(9ece6ae6)
    fail_color = rgba(f7768ee6)

    position = 0, -80
    halign = center
    valign = center
}
