# ===========================================================
# hypridle — idle management (started from shell.conf exec-once)
# Locks with hyprlock after 5 min, DPMS off after 10, and locks
# before sleep/suspend (covers lid close with logind suspend).
# ===========================================================

general {
    ignore_dbus_inhibit = false
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = hyprlock
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = hyprlock
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 600
    on-timeout = systemctl suspend
}
