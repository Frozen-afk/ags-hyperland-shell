# ===========================================================
# Hyprland rice — "Astral" setup for Fedora + AGS v2 shell
# Deploy: cp -r hypr ~/.config/ (or run ./install.sh)
# The shell integration (keybinds, layerrules, exec-once) lives
# in shell.conf — the deployed copy of hypr-snippet.conf.
# ===========================================================

# --- Environment ------------------------------------------------
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = GDK_BACKEND, wayland,x11
env = MOZ_ENABLE_WAYLAND, 1
env = XCURSOR_SIZE, 24
env = XCURSOR_THEME, Bibata-Modern-Ice

# --- Monitors ----------------------------------------------------
# Adjust for your setup; `hyprctl monitors` lists what's available.
monitor = , preferred, auto, 1

# --- Autostart ----------------------------------------------------
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
source = ~/.config/hypr/shell.conf

# --- Input --------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        scroll_factor = 0.5
    }
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# --- Look and feel ------------------------------------------------
general {
    gaps_in = 6
    gaps_out = 14
    gaps_workspaces = 6
    border_size = 2
    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(292e42aa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 14

    active_opacity = 1.0
    inactive_opacity = 0.94

    blur {
        enabled = true
        size = 7
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
        vibrancy = 0.17
        vibrancy_darkness = 0.4
    }

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000066)
    }
}

animations {
    enabled = true

    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    bezier = glide, 0.05, 0.7, 0.1, 1

    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 180, liner, loop
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, glide, slide
    animation = specialWorkspace, 1, 5, glide, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
    special_scale_factor = 0.9
}

master {
    new_status = master
    special_scale_factor = 0.9
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 400
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

# --- Compositor keybinds (the shell handles the rest) ---------------
$mainMod = SUPER

bind = $mainMod, RETURN, exec, foot
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, E, exec, ags request "toggle-window power-menu"
bind = $mainMod, F, fullscreen
bind = $mainMod, J, togglesplit
bind = $mainMod, P, pseudo
bind = $mainMod, T, togglegroup
bind = $mainMod SHIFT, F, togglefloating
bind = $mainMod SHIFT, Q, exec, wlogout

# Focus / move
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Resize with arrows (repeatable)
binde = $mainMod CTRL, left, resizeactive, -40 0
binde = $mainMod CTRL, right, resizeactive, 40 0
binde = $mainMod CTRL, up, resizeactive, 0 -40
binde = $mainMod CTRL, down, resizeactive, 0 40

# Workspaces 1-10 on the number row
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bind = $mainMod, mouse:272, movewindow
bind = $mainMod, mouse:273, resizewindow

# Scratchpad (matches the bar's special-workspace badge)
bind = $mainMod, minus, togglespecialworkspace, magic
bind = $mainMod SHIFT, minus, movetoworkspace, special:magic
